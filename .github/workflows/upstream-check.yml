name: Upstream release check

# Daily check: has Vatsim-Scandinavia/events tagged a version newer than the one
# this fork is based on? Events v2 ships pre-releases (v2.0.0-rc.N) that
# /releases/latest ignores, so this reads the newest version tag instead.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Compare upstream newest tag to our pin
        run: |
          UPSTREAM=$(git ls-remote --tags --refs https://github.com/Vatsim-Scandinavia/events.git 'v*' \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' \
            | sed '/-/!s/$/_/' | sort -V | sed 's/_$//' | tail -1)
          OURS=$(tr -d '[:space:]' < .events-upstream-version 2>/dev/null)
          echo "upstream=$UPSTREAM  ours=$OURS"
          if [ -n "$UPSTREAM" ] && [ "$UPSTREAM" != "$OURS" ]; then
            curl -sS -H "Content-Type: application/json" -X POST "${{ secrets.DISCORD_WEBHOOK }}" -d "{
              \"username\": \"Events Upstream\",
              \"embeds\": [{
                \"title\": \"⬆️ Upstream Events ${UPSTREAM} tagged\",
                \"url\": \"https://github.com/Vatsim-Scandinavia/events/releases/tag/${UPSTREAM}\",
                \"color\": 3447003,
                \"description\": \"This fork (ssa-events) is based on **${OURS}**. Review the changelog, rebase when ready, then bump .events-upstream-version.\"
              }]
            }"
          fi
